<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Anushka Nath</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body class="light">
  <!-- Header -->
  <header id="header">
    <div class="container">
      <div class="logo">
        <a href="index.html"><span class="logo-icon">⟨⟩</span>Anushka Nath</a>
      </div>
      <nav>
        <button id="theme-toggle" aria-label="Toggle dark mode">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- 404 Section -->
  <section class="error-page">
    <div class="container">
      <div class="error-content">
        <h1 class="error-title">404</h1>
        <div class="error-animation">
          <div class="astronaut">
            <div class="astronaut-body"></div>
            <div class="astronaut-head"></div>
            <div class="astronaut-arm arm-left"></div>
            <div class="astronaut-arm arm-right"></div>
            <div class="astronaut-leg leg-left"></div>
            <div class="astronaut-leg leg-right"></div>
          </div>
          <div class="planet"></div>
          <div class="stars"></div>
        </div>
        <h2 class="error-subtitle">Houston, we have a problem!</h2>
        <p class="error-message">The page you're looking for has floated off into space.</p>
        <a href="index.html" class="btn btn-primary">Return to Home</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p class="copyright">© 2025 Anushka Nath. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/theme.js"></script>
</body>
</html>
